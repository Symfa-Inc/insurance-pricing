name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  backend:
    runs-on: ubuntu-latest
    name: "Backend: Lint & Type Check"
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run all pre-commit hooks
      run: uv run pre-commit run --all-files --verbose

  frontend:
    runs-on: ubuntu-latest
    name: "Frontend: Lint, Format & Build"
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Check formatting
      run: pnpm check

    - name: Build
      run: pnpm build

  docker:
    runs-on: ubuntu-latest
    name: "Docker: Build Images"
    needs: [backend, frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build backend image
      run: docker build -t insurance-pricing-backend -f backend/Dockerfile .

    - name: Build frontend image
      run: docker build -t insurance-pricing-frontend ./frontend

    - name: Verify container startup and prediction
      shell: bash
      run: |
        trap 'docker logs fix-insurance-pricing-backend; docker rm -f fix-insurance-pricing-backend fix-insurance-pricing-frontend' EXIT
        docker run -d --name fix-insurance-pricing-backend -p 3800:8000 -e CORS_ORIGINS=http://localhost:3300 insurance-pricing-backend
        docker run -d --name fix-insurance-pricing-frontend -p 3300:3000 -e API_URL=http://localhost:3800 insurance-pricing-frontend
        curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:3800/health
        curl --retry 30 --retry-connrefused --retry-delay 2 --fail --output /dev/null http://localhost:3300
        curl --fail --header 'Content-Type: application/json' --header 'Origin: http://localhost:3300' \
          --data '{"age":35,"sex":"female","bmi":27.5,"children":1,"smoker":"yes","region":"northeast"}' \
          --dump-header /tmp/prediction-headers.txt --output /tmp/prediction.json http://localhost:3800/predict
        python - <<'PY'
        import json
        from pathlib import Path

        result = json.loads(Path("/tmp/prediction.json").read_text())
        assert abs(result["charges"] - 20291.66) < 0.01, result
        assert result["explainability_error"] is None, result
        assert len(result["shap"]["contributions"]) == 6, result
        assert result["interpretation"]["headline"], result
        assert len(result["interpretation"]["bullets"]) == 5, result
        assert "access-control-allow-origin: http://localhost:3300" in Path("/tmp/prediction-headers.txt").read_text().lower()
        print(f"Prediction: ${result['charges']:,.2f}; 6 feature contributions; 5 interpretation bullets")
        PY
